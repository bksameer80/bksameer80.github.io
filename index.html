<!DOCTYPE html>

            <a href="#" class="brand-logo">Nexis<span>Digital</span></a>
            <nav aria-label="Main Navigation"> <!--this tells screen readers and search engines that this specific list is the primary navigation structure-->

                    <li><a href="#home">Home</a></li>

                    <li><a href="#services">Services</a></li>
